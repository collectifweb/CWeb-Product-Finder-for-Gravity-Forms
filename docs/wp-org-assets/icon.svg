<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2271b1"/>
      <stop offset="100%" stop-color="#135e96"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="256" height="256" rx="48" ry="48" fill="url(#bg)"/>

  <!-- Funnel icon: three horizontal bars narrowing down to a target dot -->
  <g transform="translate(128 128)">
    <!-- Top bar (widest) -->
    <rect x="-78" y="-72" width="156" height="22" rx="11" fill="#ffffff" opacity="0.95"/>
    <!-- Middle bar -->
    <rect x="-52" y="-32" width="104" height="22" rx="11" fill="#ffffff" opacity="0.85"/>
    <!-- Bottom bar (narrowest) -->
    <rect x="-26" y="8" width="52" height="22" rx="11" fill="#ffffff" opacity="0.75"/>
    <!-- Result/target dot (the recommended product) -->
    <circle cx="0" cy="60" r="14" fill="#c04e2f"/>
    <circle cx="0" cy="60" r="6" fill="#ffffff"/>
  </g>
</svg>
